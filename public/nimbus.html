<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nimbus · Teste das oito direções</title><style>
body{margin:0;background:#0d2233;color:#f4f7ff;font:14px system-ui}main{max-width:1100px;margin:20px auto;padding:16px}h1{color:#ffd46d}fieldset{display:flex;flex-wrap:wrap;gap:16px;border:1px solid #59758c;border-radius:10px;padding:16px;margin-bottom:12px}label{display:flex;align-items:center;gap:7px}input[type=number]{width:70px}button,input{font:inherit;padding:6px}canvas{display:block;max-width:100%;height:auto;background:#355334;border:1px solid #728c68;border-radius:10px}pre{white-space:pre-wrap;background:#122e44;padding:12px}a{color:#a6dfff}.nota{color:#c2d4df}#status{min-height:24px}
</style></head><body><main><h1>Nimbus · Oito direções</h1><p class="nota">Prévia visual isolada. Os controles não alteram o personagem, colisão ou velocidade no jogo. Use os offsets exibidos para configurar outras skins.</p><fieldset><legend>Ajustes visuais</legend><label>Escala <input id="escala" type="number" min="0.2" max="1.2" step="0.05" value="0.65"></label><label>Offset X <input id="offsetX" type="number" min="-50" max="50" value="0"></label><label>Offset Y <input id="offsetY" type="number" min="-50" max="50" value="-6"></label><label><input id="flutuar" type="checkbox" checked>Flutuação</label><label><input id="mover" type="checkbox">Movimento</label><label><input id="ssj" type="checkbox">Super Saiyajin</label><label><input id="ataque" type="checkbox">Ataque</label></fieldset><fieldset><legend>Animação · 130 ms/frame</legend><button id="pausar">Pausar</button><label>Frame <input id="frame" type="range" min="0" max="4" step="1" value="0"></label><button id="restaurar">Restaurar ajustes</button></fieldset><p id="status" role="status">Carregando os 40 PNGs…</p><canvas width="1040" height="460" aria-label="Goku na Nimbus nas direções N, NE, E, SE, S, SW, W, NW"></canvas><pre id="config"></pre><a href="/">Voltar ao jogo</a><script type="module" src="/render/nimbus-previa.mjs"></script></main></body></html>
