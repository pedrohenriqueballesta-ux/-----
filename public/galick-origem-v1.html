<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Galick Gun V1 — teste da origem ancorada</title>
<style>
body{margin:0;padding:18px;background:#101827;color:#e9f2ff;font:15px system-ui}main{max-width:1040px;margin:auto}
label{display:inline-flex;gap:8px;align-items:center;margin:0 16px 12px 0}select,input,button{font:inherit}
canvas{display:block;max-width:100%;background:#1b2440;border:1px solid #64728c}pre{white-space:pre-wrap;color:#acd0f4}
small{color:#aebdcf}
</style>
<main>
<h1>Galick Gun V1 — origem ancorada</h1>
<p><small>Teste isolado da folha de origem. Corpo, ponta, impacto e o Galick Gun jogável não usam este pacote. A cruz verde marca a emissão estimada nas mãos.</small></p>
<label>Direção <select id="direcao"><option>S</option><option>SE</option><option>E</option><option>NE</option><option>N</option><option>NW</option><option>W</option><option>SW</option></select></label>
<label>Distância do alvo <select id="distancia"><option value="32">Perto · 32</option><option value="180" selected>Média · 180</option><option value="384">Longe · 384</option></select></label>
<label>Frame <input id="frame" type="range" min="0" max="15" value="0"><output id="numero">0</output></label>
<label><input id="animar" type="checkbox"> Animar a 105 ms/frame</label>
<label><input id="mover" type="checkbox"> Simular deslocamento</label>
<label><input id="claro" type="checkbox"> Fundo claro</label>
<label><input id="marcadores" type="checkbox" checked> Marcadores</label>
<label>Ajuste X <input id="ajusteX" type="range" min="-30" max="30" value="0"><output id="valorX">0</output></label>
<label>Ajuste Y <input id="ajusteY" type="range" min="-30" max="30" value="0"><output id="valorY">0</output></label>
<canvas id="previa" width="1000" height="680"></canvas>
<pre id="dados"></pre>
<script type="module" src="/render/galick-origem-v1-debug.mjs?v=palma-ancora-2"></script>
</main>
</html>
