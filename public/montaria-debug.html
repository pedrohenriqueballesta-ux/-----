<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Validação de encaixe · Rena Natalina</title>
<style>
body{margin:0;background:#0b1826;color:#eaf4ff;font:14px system-ui,sans-serif}main{max-width:1200px;margin:20px auto;padding:18px}h1{color:#ffd45c}fieldset{display:flex;flex-wrap:wrap;gap:12px;align-items:center;border:1px solid #42647d;border-radius:8px;padding:12px;margin:10px 0}label{display:flex;gap:5px;align-items:center}input[type=number]{width:70px}button,select,input{font:inherit;padding:5px}.stage{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}canvas{display:block;width:100%;background:#557b45;border:1px solid #668b72;image-rendering:auto}pre{margin:0;background:#132b3d;padding:12px;white-space:pre-wrap;min-height:300px;overflow:auto}.nota{color:#b9cedc}@media(max-width:800px){.stage{grid-template-columns:1fr}pre{min-height:120px}}
</style></head>
<body><main><h1>Validação real · Rena Natalina + Goku Natalino</h1>
<p class="nota">Prévia de depuração isolada. Usa <code>desenharNimbus</code> e <code>drawGoku</code> do renderer. Escala e offsets abaixo são temporários e não alteram as configurações do jogo.</p>
<fieldset><label>Direção <select id="direcao"><option value="s">S</option><option value="se">SE</option><option value="e">E</option><option value="ne">NE</option><option value="n">N</option><option value="nw">NW</option><option value="w">W</option><option value="sw">SW</option></select></label><label>Modo <select id="modo"><option value="original">Original</option><option value="camadas">Camadas reais</option></select></label><label><input id="montaria" type="checkbox" checked> Rena</label><label><input id="personagem" type="checkbox" checked> Goku</label><label><input id="zoom" type="number" min="0.5" max="2.5" step="0.1" value="1"> Zoom</label></fieldset>
<fieldset><label><input id="mundo" type="checkbox" checked> Mundo</label><label><input id="sela" type="checkbox" checked> Sela</label><label><input id="ref" type="checkbox" checked> Ref. renderer</label><label><input id="composicao" type="checkbox" checked> Composição</label><label><input id="quadril" type="checkbox" checked> Quadril</label></fieldset>
<fieldset><label>Escala Goku <input id="escala" type="number" min="0.5" max="1.5" step="0.01" value="1"></label><label>Offset X <input id="ox" type="number" min="-80" max="80" value="0"></label><label>Offset Y <input id="oy" type="number" min="-80" max="80" value="0"></label><button id="reset">Restaurar</button></fieldset>
<section class="stage"><canvas id="preview" width="1000" height="650"></canvas><pre id="dados"></pre></section>
<script type="module" src="/render/previas/montaria-debug.mjs"></script></main></body></html>
